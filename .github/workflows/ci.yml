name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e-and-package:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          UMLAB_MONGO_URI: ${{ secrets.UMLAB_MONGO_URI }}
          UMLAB_DB: umlab
      - name: E2E (Electron + mongodb-memory-server)
        run: npm run e2e -w @umlab/desktop
      - name: Đóng gói .exe
        run: npx electron-builder --win --x64 --publish never
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: UMLab-windows
          path: |
            apps/desktop/release/**/*.exe
